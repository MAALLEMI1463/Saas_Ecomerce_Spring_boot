<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — AdminFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-100: #dbeafe;
      --blue-300: #93c5fd;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --purple-500: #8b5cf6;
      --purple-600: #7c3aed;
      --pink-500:  #ec4899;
      --bg: #f0f4ff;
      --surface: #ffffff;
      --text-primary: #1e1b4b;
      --text-muted: #6b7280;
      --border: rgba(148,163,184,0.22);
      --shadow-md: 0 8px 40px rgba(99,102,241,0.14);
      --shadow-lg: 0 20px 60px rgba(99,102,241,0.18);
      --radius: 20px;
      --radius-sm: 10px;
      --transition: all 0.26s cubic-bezier(0.4,0,0.2,1);
    }

    html { font-size: 15px; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow: hidden;
    }

    /* ── Decorative blobs ───────────────────────────────── */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(99,102,241,0.12), transparent 70%);
      top: -120px; left: -120px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(236,72,153,0.09), transparent 70%);
      bottom: -80px; right: -80px;
    }

    /* ── Card ───────────────────────────────────────────── */
    .login-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: fadeUp 0.45s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card header strip ──────────────────────────────── */
    .card-header {
      background: linear-gradient(135deg, var(--blue-600) 0%, var(--purple-500) 100%);
      padding: 32px 36px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card-header::before {
      content: '';
      position: absolute;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      top: -60px; right: -40px;
    }
    .card-header::after {
      content: '';
      position: absolute;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      bottom: -30px; left: -20px;
    }

    .brand-logo {
      width: 52px; height: 52px;
      background: rgba(255,255,255,0.18);
      border-radius: 14px;
      display: grid; place-items: center;
      margin: 0 auto 14px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      position: relative; z-index: 1;
    }
    .brand-logo svg { color: #fff; }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem; font-weight: 800;
      color: #fff; line-height: 1.2;
      position: relative; z-index: 1;
    }
    .card-subtitle {
      font-size: 0.82rem; color: rgba(255,255,255,0.72);
      margin-top: 5px; position: relative; z-index: 1;
    }

    /* ── Card body ──────────────────────────────────────── */
    .card-body { padding: 30px 36px 34px; }

    /* ── Alert messages ─────────────────────────────────── */
    .alert {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 14px; border-radius: var(--radius-sm);
      font-size: 0.83rem; font-weight: 500;
      margin-bottom: 20px;
      animation: fadeUp 0.3s ease;
    }
    .alert.error   { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert.success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .alert svg { flex-shrink: 0; }

    /* ── Form ───────────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }

    .form-label {
      font-size: 0.82rem; font-weight: 600; color: var(--text-primary);
    }

    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
      transition: var(--transition);
    }
    .form-input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; color: var(--text-primary);
      outline: none; transition: var(--transition);
    }
    .form-input::placeholder { color: #b0b7c3; }
    .form-input:focus {
      border-color: var(--blue-300);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }
    .form-input:focus + .input-icon,
    .input-wrap:focus-within .input-icon { color: var(--blue-500); }

    /* Password toggle */
    .toggle-pw {
      position: absolute; right: 13px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 2px;
      transition: var(--transition); line-height: 0;
    }
    .toggle-pw:hover { color: var(--blue-600); }

    /* ── Submit ─────────────────────────────────────────── */
    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--blue-600), var(--purple-500));
      color: #fff; border: none; border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: var(--transition);
      box-shadow: 0 4px 16px rgba(99,102,241,0.32);
      margin-top: 6px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99,102,241,0.44);
    }
    .btn-login:active { transform: translateY(0); }

    /* ── Footer note ────────────────────────────────────── */
    .card-footer-note {
      text-align: center;
      padding: 14px 36px 18px;
      border-top: 1px solid var(--border);
      font-size: 0.76rem; color: var(--text-muted);
    }
    .card-footer-note span { color: var(--blue-600); font-weight: 600; }

    @media (max-width: 460px) {
      .card-header { padding: 26px 24px 22px; }
      .card-body   { padding: 24px 24px 28px; }
      .card-footer-note { padding: 12px 24px 16px; }
    }
  </style>
</head>
<body>

<div class="login-card">

  <!-- Header -->
  <div class="card-header">
    <div class="brand-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div class="card-title">StoreSaaS</div>
    <div class="card-subtitle">Sign in to access your dashboard</div>
  </div>

  <!-- Body -->
  <div class="card-body">

    <!-- Error message -->
    <div class="alert error" th:if="${errorMsg}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span th:text="${errorMsg}">Invalid credentials.</span>
    </div>

    <!-- Logout success message -->
    <div class="alert success" th:if="${logoutMsg}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span th:text="${logoutMsg}">You have been logged out.</span>
    </div>

    <!-- Form -->
    <form th:action="@{/login}" method="post">

      <!-- Username -->
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrap">
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required/>
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required/>
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button class="toggle-pw" type="button" onclick="togglePassword()" title="Show/hide password" tabindex="-1">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-login" type="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Sign In
      </button>

    </form>
  </div>

  <!-- Footer note -->
  <div class="card-footer-note">
    Protected area — <span>AdminFlow SaaS Dashboard</span>
  </div>

</div>

<script>
  function togglePassword() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('eye-icon');
    const isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    icon.innerHTML = isHidden
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }
</script>
</body>
</html>
