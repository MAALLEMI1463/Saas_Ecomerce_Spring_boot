<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details — AdminFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-100: #dbeafe;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --purple-100: #ede9fe;
      --purple-500: #8b5cf6;
      --purple-600: #7c3aed;
      --amber-100: #fef3c7;
      --amber-500: #f59e0b;
      --amber-600: #d97706;
      --bg: #f0f4ff;
      --surface: #ffffff;
      --text-primary: #1e1b4b;
      --text-muted: #6b7280;
      --border: rgba(148,163,184,0.2);
      --shadow-md: 0 8px 32px rgba(99,102,241,0.13);
      --radius: 18px;
      --transition: all 0.26s cubic-bezier(0.4,0,0.2,1);
    }

    html { font-size: 15px; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── Wrapper ────────────────────────────────────────── */
    .wrapper {
      width: 100%;
      max-width: 820px;
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Top bar ────────────────────────────────────────── */
    .top-bar {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap; gap: 10px;
    }

    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.8rem; color: var(--text-muted);
    }
    .breadcrumb a {
      color: var(--blue-600); font-weight: 600; text-decoration: none;
    }
    .breadcrumb a:hover { text-decoration: underline; }

    .actions { display: flex; gap: 10px; }

    .btn-edit {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 22px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, var(--amber-600), var(--amber-500));
      color: #fff; font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem; font-weight: 600; text-decoration: none;
      cursor: pointer; transition: var(--transition);
      box-shadow: 0 4px 12px rgba(245,158,11,0.3);
    }
    .btn-edit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245,158,11,0.42); }

    .btn-back {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 20px; border-radius: 50px;
      background: var(--surface); color: var(--text-muted);
      border: 1.5px solid var(--border); font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem; font-weight: 500; text-decoration: none;
      cursor: pointer; transition: var(--transition);
    }
    .btn-back:hover { background: #fff; color: var(--text-primary); border-color: #94a3b8; }

    /* ── Card ───────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: grid;
      grid-template-columns: 280px 1fr;
    }

    /* Left: image */
    .img-col {
      display: flex; flex-direction: column;
      background: #f8faff; overflow: hidden;
    }
    .product-img {
      width: 100%; flex: 1; object-fit: cover;
      display: block; min-height: 240px;
      transition: transform 0.5s ease;
    }
    .img-col:hover .product-img { transform: scale(1.04); }

    .img-footer {
      padding: 11px 16px; border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex; align-items: center; gap: 8px;
    }
    .dot-green {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.18);
    }
    .img-status { font-size: 0.74rem; font-weight: 600; color: var(--text-muted); }

    /* Right: info */
    .info-col { display: flex; flex-direction: column; }

    .info-header {
      padding: 22px 26px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 10px;
    }
    .product-name {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem; font-weight: 800;
      color: var(--text-primary); line-height: 1.3;
    }
    .id-chip {
      flex-shrink: 0; padding: 3px 11px; border-radius: 20px;
      background: var(--blue-100); color: var(--blue-600);
      font-size: 0.71rem; font-weight: 700; white-space: nowrap;
    }

    /* Price strip */
    .price-strip {
      padding: 14px 26px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      display: flex; align-items: center; gap: 12px;
    }
    .price-icon {
      width: 38px; height: 38px; border-radius: 11px;
      background: linear-gradient(135deg, var(--blue-600), var(--purple-500));
      display: grid; place-items: center; color: #fff; flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(99,102,241,0.28);
    }
    .price-lbl {
      font-size: 0.66rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted);
    }
    .price-val {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem; font-weight: 800; color: var(--text-primary); line-height: 1;
    }
    .price-cur { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; margin-left: 4px; }

    /* Field rows */
    .fields { flex: 1; padding: 4px 26px; }
    .field {
      display: flex; align-items: flex-start; gap: 13px;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .field:last-child { border-bottom: none; }

    .field-icon {
      width: 32px; height: 32px; border-radius: 9px;
      display: grid; place-items: center; flex-shrink: 0; margin-top: 1px;
    }
    .field-icon.blue   { background: var(--blue-100);   color: var(--blue-600); }
    .field-icon.purple { background: var(--purple-100); color: var(--purple-600); }
    .field-icon.amber  { background: var(--amber-100);  color: var(--amber-600); }

    .field-lbl {
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); margin-bottom: 3px;
    }
    .field-val {
      font-size: 0.88rem; font-weight: 500;
      color: var(--text-primary); line-height: 1.55;
    }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 640px) {
      .card { grid-template-columns: 1fr; }
      .product-img { min-height: 200px; max-height: 220px; }
      .info-header { padding: 16px 18px 12px; }
      .price-strip, .fields { padding-left: 18px; padding-right: 18px; }
    }
    @media (max-width: 400px) {
      .top-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="breadcrumb">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <a href="/dashboard">Dashboard</a>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      <a href="/products">Products</a>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      Details
    </div>
    <div class="actions">
      <a class="btn-edit" th:href="@{/products/{id}/edit(id=${product.id})}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Edit
      </a>
      <a class="btn-back" href="/products">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back
      </a>
    </div>
  </div>

  <!-- Card -->
  <div class="card">

    <!-- Image column -->
    <div class="img-col">
      <img class="product-img"
           th:src="@{'/images/' + ${product.image}}"
           th:alt="${product.name}"
           onerror="this.src='https://placehold.co/280x280/f0f4ff/6b7280?text=No+Image'"/>
      <div class="img-footer">
        <div class="dot-green"></div>
        <span class="img-status">Active · In Catalogue</span>
      </div>
    </div>

    <!-- Info column -->
    <div class="info-col">

      <div class="info-header">
        <div class="product-name" th:text="${product.name}">Product Name</div>
        <span class="id-chip" th:text="'ID #' + ${product.id}">#—</span>
      </div>

      <div class="price-strip">
        <div class="price-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <div>
          <div class="price-lbl">Price</div>
          <div class="price-val">
            <span th:text="${product.price}">0</span><span class="price-cur">DA</span>
          </div>
        </div>
      </div>

      <div class="fields">

        <!-- Description -->
        <div class="field">
          <div class="field-icon blue">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
          </div>
          <div>
            <div class="field-lbl">Description</div>
            <div class="field-val" th:text="${product.description}">—</div>
          </div>
        </div>

        <!-- Image file -->
        <div class="field">
          <div class="field-icon purple">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <div>
            <div class="field-lbl">Image File</div>
            <div class="field-val" th:text="${product.image}">—</div>
          </div>
        </div>

        <!-- Added on -->
        <div class="field">
          <div class="field-icon amber">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <div>
            <div class="field-lbl">Added On</div>
            <div class="field-val"
                 th:text="${#temporals.format(product.createdAt, 'dd/MM/yyyy HH:mm')}">—</div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
</body>
</html>
