<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --white:        #ffffff;
  --surface:      #f8f7f4;
  --border:       #e8e6e0;
  --border-hover: #c8c5bc;
  --ink:          #1a1916;
  --ink-muted:    #6b6860;
  --ink-faint:    #a8a59e;
  --accent:       #c8502a;
  --accent-deep:  #9e3c1c;
  --accent-light: #f5ede9;
  --accent-glow:  rgba(200,80,42,.18);
  --success:      #3a7d44;
  --success-light:#e8f5ea;

  --shadow-sm: 0 1px 3px rgba(26,25,22,.06), 0 1px 2px rgba(26,25,22,.04);
  --shadow-md: 0 4px 16px rgba(26,25,22,.09), 0 1px 4px rgba(26,25,22,.04);

  --radius:    10px;
  --radius-xl: 24px;
  --nav-h:     68px;
  --ease:      cubic-bezier(.4,0,.2,1);
  --spring:    cubic-bezier(.34,1.56,.64,1);
}

html { font-size: 16px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Navbar ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: var(--nav-h);
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.nav__inner {
  max-width: 1280px; margin: 0 auto; padding: 0 2rem;
  height: 100%; display: flex; align-items: center;
}
.nav__logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: var(--ink);
}
.nav__logo-mark {
  width: 34px; height: 34px; background: var(--ink);
  border-radius: 8px; position: relative; overflow: hidden; flex-shrink: 0;
}
.nav__logo-mark::before {
  content: ''; position: absolute;
  width: 14px; height: 14px; border: 2.5px solid var(--white);
  border-radius: 50%; top: 7px; left: 7px;
}
.nav__logo-mark::after {
  content: ''; position: absolute;
  width: 8px; height: 8px; background: var(--accent);
  border-radius: 50%; bottom: 7px; right: 7px;
}
.nav__logo-text {
  font-family: 'DM Serif Display', serif; font-size: 1.35rem;
  letter-spacing: -0.02em; line-height: 1;
}
.nav__logo-text em { font-style: italic; color: var(--accent); }

/* Nav steps — show completed state */
.nav__spacer { flex: 1; }
.nav__steps { display: flex; align-items: center; gap: 0; font-size: .75rem; }
.nav__step  {
  display: flex; align-items: center; gap: 6px;
  color: var(--success); padding: 0 .75rem;
}
.nav__step-num {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--success); border: 1.5px solid var(--success);
  color: var(--white);
  display: grid; place-items: center;
  font-size: .65rem; font-weight: 600; flex-shrink: 0;
}
.nav__step-sep { width: 24px; height: 1px; background: var(--success); opacity: .4; }

@media (max-width: 600px) { .nav__steps { display: none; } }

/* ── Main: centred success card ── */
main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(var(--nav-h) + 3rem) 1.5rem 4rem;
}

.success-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 3.5rem 3rem;
  max-width: 480px;
  width: 100%;
  text-align: center;
  box-shadow: var(--shadow-md);
  animation: card-in 500ms var(--spring) forwards;
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(20px) scale(.97); }
  to   { opacity: 1; transform: translateY(0)    scale(1);   }
}

/* Icon ring */
.success-icon {
  width: 80px; height: 80px;
  background: var(--success-light);
  border: 2px solid rgba(58,125,68,.2);
  border-radius: 50%;
  display: grid; place-items: center;
  margin: 0 auto 1.75rem;
  font-size: 2.2rem;
  animation: pop 450ms var(--spring) 200ms both;
}

@keyframes pop {
  from { transform: scale(.6); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}

/* Badge above title */
.success-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .68rem; font-weight: 500; letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--success);
  background: var(--success-light);
  border-radius: 99px; padding: 4px 12px;
  margin-bottom: 1rem;
}
.success-badge-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--success);
}

.success-card h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(1.5rem, 4vw, 2rem);
  letter-spacing: -0.03em; line-height: 1.15;
  color: var(--ink); margin-bottom: .875rem;
}

.success-card h1 em { font-style: italic; color: var(--success); }

.success-card p {
  font-size: .95rem; font-weight: 300;
  color: var(--ink-muted); line-height: 1.75;
  max-width: 34ch; margin: 0 auto 2rem;
}

/* Divider */
.success-divider {
  border: none; border-top: 1px solid var(--border); margin: 0 0 2rem;
}

/* Status chips */
.success-chips {
  display: flex; justify-content: center; flex-wrap: wrap;
  gap: .625rem; margin-bottom: 2rem;
}
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .75rem; color: var(--ink-muted);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; padding: 5px 12px;
}
.chip svg { color: var(--success); flex-shrink: 0; }

/* CTA button */
.btn-home {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 50px; width: 100%; max-width: 320px;
  background: var(--ink); color: var(--white);
  font-family: 'DM Sans', sans-serif; font-size: .9rem; font-weight: 500;
  letter-spacing: .02em;
  border: 2px solid var(--ink); border-radius: var(--radius);
  text-decoration: none;
  transition: background 200ms var(--ease), border-color 200ms, transform 120ms, box-shadow 200ms;
}
.btn-home:hover {
  background: var(--accent); border-color: var(--accent);
  box-shadow: 0 8px 24px var(--accent-glow); transform: translateY(-1px);
}
.btn-home:active { transform: scale(.97); }

.btn-home-arrow { display: inline-flex; transition: transform 200ms var(--spring); }
.btn-home:hover .btn-home-arrow { transform: translateX(-3px); }

@media (max-width: 480px) {
  .success-card { padding: 2.5rem 1.5rem; }
}
</style>
</head>
<body>


<!-- ── Success Card ── -->
<main>
  <div class="success-card" role="main">

    <div class="success-icon" aria-hidden="true">🎉</div>

    <span class="success-badge">
      <span class="success-badge-dot" aria-hidden="true"></span>
      Order confirmed
    </span>

    <h1>Order Placed <em>Successfully!</em></h1>

    <p>
      Thank you for your order. The store owner will review and confirm it shortly.
    </p>

    <hr class="success-divider" />

    <!-- Quick status chips -->
    <div class="success-chips" aria-label="What happens next">
      <span class="chip">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M2 6l2.5 2.5L10 3" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Order received
      </span>
      <span class="chip">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M6 3.5v3l1.5 1.5" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Awaiting confirmation
      </span>
      <span class="chip">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
          <path d="M2 6.5l1.5 1.5a5 5 0 0 0 5.5-5" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="9" cy="3" r="1.8" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        Delivery on the way
      </span>
    </div>

    <!-- CTA -->
    <a class="btn-home"
       th:href="@{/store/home}"
       href="#"
       aria-label="Continue shopping">
      <span class="btn-home-arrow" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M9 3L4 7.5 9 12" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      Continue Shopping
    </a>

  </div>
</main>

<script>
    // Clear cart after successful order
    localStorage.removeItem('saas_cart');
</script>

</body>
</html>
