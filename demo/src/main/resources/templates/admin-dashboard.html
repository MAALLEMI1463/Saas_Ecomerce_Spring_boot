<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome — AdminFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-100: #dbeafe;
      --blue-300: #93c5fd;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --purple-100: #ede9fe;
      --purple-500: #8b5cf6;
      --purple-600: #7c3aed;
      --pink-500:  #ec4899;
      --green-100: #dcfce7;
      --green-700: #15803d;
      --bg: #f0f4ff;
      --surface: #ffffff;
      --text-primary: #1e1b4b;
      --text-muted: #6b7280;
      --border: rgba(148,163,184,0.22);
      --shadow-md: 0 8px 32px rgba(99,102,241,0.12);
      --shadow-lg: 0 20px 60px rgba(99,102,241,0.16);
      --radius: 20px;
      --radius-sm: 10px;
      --transition: all 0.26s cubic-bezier(0.4,0,0.2,1);
    }

    html { font-size: 15px; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      position: relative;
      overflow: hidden;
    }

    /* ── Background blobs ───────────────────────────────── */
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(99,102,241,0.11), transparent 70%);
      top: -100px; left: -100px;
    }
    body::after {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(236,72,153,0.08), transparent 70%);
      bottom: -80px; right: -80px;
    }

    /* ── Card ───────────────────────────────────────────── */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: fadeUp 0.45s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card header ────────────────────────────────────── */
    .card-header {
      background: linear-gradient(135deg, var(--blue-600) 0%, var(--purple-500) 100%);
      padding: 32px 36px 26px;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .card-header::before {
      content: ''; position: absolute;
      width: 200px; height: 200px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
      top: -70px; right: -50px;
    }
    .card-header::after {
      content: ''; position: absolute;
      width: 110px; height: 110px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -30px; left: -20px;
    }

    /* Avatar */
    .admin-avatar {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.35);
      display: grid; place-items: center;
      margin: 0 auto 14px;
      position: relative; z-index: 1;
      backdrop-filter: blur(8px);
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem; font-weight: 800; color: #fff;
    }

    .welcome-label {
      font-size: 0.78rem; font-weight: 600;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 6px;
      position: relative; z-index: 1;
    }
    .welcome-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.45rem; font-weight: 800;
      color: #fff; line-height: 1.25;
      position: relative; z-index: 1;
    }
    .welcome-title .username {
      background: rgba(255,255,255,0.22);
      padding: 1px 10px; border-radius: 20px;
      font-size: 1.1rem;
    }

    /* Brand strip */
    .brand-strip {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 12px;
      position: relative; z-index: 1;
    }
    .brand-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 0.78rem; font-weight: 700;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.08em;
    }

    /* ── Card body ──────────────────────────────────────── */
    .card-body { padding: 28px 36px 10px; }

    /* Success alert */
    .alert-success {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 14px; border-radius: var(--radius-sm);
      background: var(--green-100); color: var(--green-700);
      border: 1px solid #bbf7d0;
      font-size: 0.83rem; font-weight: 500;
      margin-bottom: 22px;
      animation: fadeUp 0.3s ease;
    }
    .alert-success svg { flex-shrink: 0; }

    /* Access description */
    .access-card {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px; border-radius: var(--radius-sm);
      background: var(--bg); border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .access-icon {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue-100), var(--purple-100));
      display: grid; place-items: center; color: var(--blue-600);
    }
    .access-text strong {
      display: block; font-size: 0.84rem; font-weight: 700;
      color: var(--text-primary); margin-bottom: 2px;
    }
    .access-text span { font-size: 0.78rem; color: var(--text-muted); line-height: 1.5; }

    /* ── Quick actions ──────────────────────────────────── */
    .actions-label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 10px;
    }
    .action-links {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 14px;
    }

    .action-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 13px 16px; border-radius: var(--radius-sm);
      text-decoration: none; font-family: 'DM Sans', sans-serif;
      font-size: 0.86rem; font-weight: 600; cursor: pointer;
      transition: var(--transition); border: 1.5px solid transparent;
    }
    .action-btn .action-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: grid; place-items: center; flex-shrink: 0;
      transition: var(--transition);
    }
    .action-btn span { line-height: 1.3; }

    /* Create user */
    .btn-create {
      background: linear-gradient(135deg, #eff6ff, #f5f3ff);
      color: var(--blue-600); border-color: rgba(99,102,241,0.15);
    }
    .btn-create .action-icon { background: var(--blue-100); color: var(--blue-600); }
    .btn-create:hover {
      background: linear-gradient(135deg, var(--blue-600), var(--purple-500));
      color: #fff; border-color: transparent;
      box-shadow: 0 6px 18px rgba(99,102,241,0.32);
      transform: translateY(-2px);
    }
    .btn-create:hover .action-icon { background: rgba(255,255,255,0.2); color: #fff; }

    /* Dashboard */
    .btn-dashboard {
      background: linear-gradient(135deg, #f0fdf4, #f5f3ff);
      color: #16a34a; border-color: rgba(34,197,94,0.15);
    }
    .btn-dashboard .action-icon { background: #dcfce7; color: #16a34a; }
    .btn-dashboard:hover {
      background: linear-gradient(135deg, #16a34a, #4ade80);
      color: #fff; border-color: transparent;
      box-shadow: 0 6px 18px rgba(22,163,74,0.28);
      transform: translateY(-2px);
    }
    .btn-dashboard:hover .action-icon { background: rgba(255,255,255,0.2); color: #fff; }

    /* ── Logout as action-btn ───────────────────────────── */
    .btn-logout {
      width: 100%; padding: 13px 16px;
      display: flex; align-items: center; gap: 9px;
      background: linear-gradient(135deg, #fce7f3, #ede9fe);
      border: 1.5px solid rgba(236,72,153,0.2);
      border-radius: var(--radius-sm);
      color: var(--purple-600); font-family: 'DM Sans', sans-serif;
      font-size: 0.86rem; font-weight: 600; cursor: pointer;
      transition: var(--transition); text-align: left;
    }
    .btn-logout .action-icon { background: var(--purple-100); color: var(--purple-600); }
    .btn-logout:hover {
      background: linear-gradient(135deg, var(--pink-500), var(--purple-500));
      color: #fff; border-color: transparent;
      box-shadow: 0 6px 18px rgba(236,72,153,0.32);
      transform: translateY(-2px);
    }
    .btn-logout:hover .action-icon { background: rgba(255,255,255,0.2); color: #fff; }

    @media (max-width: 460px) {
      .card-header  { padding: 26px 22px 22px; }
      .card-body    { padding: 22px 22px 20px; }
      .action-links { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- ── Header ── -->
  <div class="card-header">
    <div class="admin-avatar">A</div>
    <div class="welcome-label">Welcome back</div>
    <div class="welcome-title">
      Admin <span class="username" th:text="${username}">—</span>
    </div>
    <div class="brand-strip">
      <div class="brand-dot"></div>
      <span class="brand-name">ADMINFLOW</span>
      <div class="brand-dot"></div>
    </div>
  </div>

  <!-- ── Body ── -->
  <div class="card-body">

    <!-- Success message -->
    <div class="alert-success" th:if="${successMsg}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span th:text="${successMsg}">Operation successful.</span>
    </div>

    <!-- Access info -->
    <div class="access-card">
      <div class="access-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="access-text">
        <strong>Full Admin Access Granted</strong>
        <span>You have full access to manage users, products, and orders.</span>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="actions-label">Quick Actions</div>
    <div class="action-links">

      <a class="action-btn btn-create" th:href="@{/register}">
        <div class="action-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
        </div>
        <span>Create New User</span>
      </a>



      <form th:action="@{/logout}" method="post" style="display:contents;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="action-btn btn-logout" type="submit">
          <div class="action-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </div>
          <span>Logout</span>
        </button>
      </form>

    </div>
  </div>

</div>

</body>
</html>
