<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register New User — AdminFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-100: #dbeafe;
      --blue-300: #93c5fd;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --purple-100: #ede9fe;
      --purple-500: #8b5cf6;
      --purple-600: #7c3aed;
      --pink-500:  #ec4899;
      --bg: #f0f4ff;
      --surface: #ffffff;
      --text-primary: #1e1b4b;
      --text-muted: #6b7280;
      --border: rgba(148,163,184,0.22);
      --shadow-lg: 0 20px 60px rgba(99,102,241,0.16);
      --radius: 20px;
      --radius-sm: 10px;
      --transition: all 0.26s cubic-bezier(0.4,0,0.2,1);
    }

    html { font-size: 15px; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      position: relative;
      overflow: hidden;
    }

    /* ── Background blobs ───────────────────────────────── */
    body::before, body::after {
      content: ''; position: fixed; border-radius: 50%;
      pointer-events: none; z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(99,102,241,0.11), transparent 70%);
      top: -100px; left: -100px;
    }
    body::after {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(236,72,153,0.08), transparent 70%);
      bottom: -80px; right: -80px;
    }

    /* ── Card ───────────────────────────────────────────── */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: fadeUp 0.45s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Card header ────────────────────────────────────── */
    .card-header {
      background: linear-gradient(135deg, var(--blue-600), var(--purple-500));
      padding: 28px 36px 24px;
      position: relative; overflow: hidden;
    }
    .card-header::before {
      content: ''; position: absolute;
      width: 180px; height: 180px; border-radius: 50%;
      background: rgba(255,255,255,0.07);
      top: -60px; right: -40px;
    }
    .card-header::after {
      content: ''; position: absolute;
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -30px; left: -20px;
    }

    .header-inner {
      display: flex; align-items: center; gap: 14px;
      position: relative; z-index: 1;
    }
    .header-icon {
      width: 48px; height: 48px; border-radius: 13px; flex-shrink: 0;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      display: grid; place-items: center; color: #fff;
      backdrop-filter: blur(8px);
    }
    .header-text {}
    .header-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.2rem; font-weight: 800;
      color: #fff; line-height: 1.25;
    }
    .header-sub {
      font-size: 0.78rem; color: rgba(255,255,255,0.68); margin-top: 2px;
    }

    /* ── Card body ──────────────────────────────────────── */
    .card-body { padding: 26px 36px 30px; }

    /* Error alert */
    .alert-error {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 14px; border-radius: var(--radius-sm);
      background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca;
      font-size: 0.83rem; font-weight: 500; margin-bottom: 20px;
      animation: fadeUp 0.3s ease;
    }

    /* Form groups */
    .form-group {
      display: flex; flex-direction: column; gap: 7px;
      margin-bottom: 18px;
    }
    .form-label {
      font-size: 0.82rem; font-weight: 600; color: var(--text-primary);
    }
    .form-label .req { color: #ef4444; margin-left: 2px; }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
      transition: var(--transition);
    }
    .form-input,
    .form-select {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; color: var(--text-primary);
      outline: none; transition: var(--transition);
      appearance: none;
    }
    .form-input::placeholder { color: #b0b7c3; }
    .form-input:focus,
    .form-select:focus {
      border-color: var(--blue-300); background: #fff;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }
    .input-wrap:focus-within .input-icon { color: var(--blue-500); }

    /* Password toggle */
    .toggle-pw {
      position: absolute; right: 13px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 2px; line-height: 0;
      transition: var(--transition);
    }
    .toggle-pw:hover { color: var(--blue-600); }

    /* Select arrow */
    .select-arrow {
      position: absolute; right: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }

    /* Field error */
    .field-error {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.74rem; color: #ef4444; font-weight: 500;
    }

    /* Divider */
    .divider {
      height: 1px; background: var(--border); margin: 4px 0 20px;
    }

    /* ── Actions ────────────────────────────────────────── */
    .form-actions {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-top: 6px;
    }

    .btn-submit {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; border: none; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--blue-600), var(--purple-500));
      color: #fff; font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 700; cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 14px rgba(99,102,241,0.3);
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(99,102,241,0.42);
    }

    .btn-cancel {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 12px; border-radius: var(--radius-sm);
      background: var(--bg); color: var(--text-muted);
      border: 1.5px solid var(--border); font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem; font-weight: 500; text-decoration: none;
      cursor: pointer; transition: var(--transition);
    }
    .btn-cancel:hover {
      background: #fff; color: var(--text-primary); border-color: #94a3b8;
    }

    @media (max-width: 460px) {
      .card-header { padding: 22px 22px 20px; }
      .card-body   { padding: 22px 22px 26px; }
      .form-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="card-header">
    <div class="header-inner">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <div class="header-text">
        <div class="header-title">Register New User</div>
        <div class="header-sub">Admin Only — Create a new account</div>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="card-body">

    <!-- Error message -->
    <div class="alert-error" th:if="${errorMsg}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span th:text="${errorMsg}">An error occurred.</span>
    </div>

    <form th:action="@{/register}" th:object="${registerDTO}" method="post">

      <!-- Username -->
      <div class="form-group">
        <label class="form-label" for="username">
          Username <span class="req">*</span>
        </label>
        <div class="input-wrap">
          <input class="form-input" type="text" id="username"
                 th:field="*{username}"
                 placeholder="Enter username" required/>
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <span class="field-error"
              th:if="${#fields.hasErrors('username')}"
              th:errors="*{username}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Username error
        </span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">
          Password <span class="req">*</span>
        </label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password"
                 th:field="*{password}"
                 placeholder="Enter password" required/>
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button class="toggle-pw" type="button"
                  onclick="togglePw('password', 'eye-pw')" tabindex="-1">
            <svg id="eye-pw" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="field-error"
              th:if="${#fields.hasErrors('password')}"
              th:errors="*{password}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Password error
        </span>
      </div>

      <!-- Subdomain -->
      <div class="form-group">
        <label class="form-label" for="subdomain">
          Subdomain <span class="req">*</span>
        </label>
        <div class="input-wrap">
          <input class="form-input" type="text" id="subdomain"
                 th:field="*{subdomain}"
                 placeholder="e.g. store-name" required/>
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <span class="field-error"
              th:if="${#fields.hasErrors('subdomain')}"
              th:errors="*{subdomain}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Subdomain error
        </span>
      </div>

      <!-- Role -->
      <div class="form-group">
        <label class="form-label" for="role">Role</label>
        <div class="input-wrap">
          <select class="form-select" id="role" th:field="*{role}">
            <option th:each="role : ${roles}"
                    th:value="${role}"
                    th:text="${role}">
            </option>
          </select>
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <svg class="select-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <span class="field-error"
              th:if="${#fields.hasErrors('role')}"
              th:errors="*{role}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Role error
        </span>
      </div>

      <div class="divider"></div>

      <!-- Actions -->
      <div class="form-actions">
        <button class="btn-submit" type="submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
          Create User
        </button>
        <a class="btn-cancel" th:href="@{/admin/dashboard}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Cancel
        </a>
      </div>

    </form>
  </div>

</div>

<script>
  function togglePw(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(iconId);
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    icon.innerHTML = show
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }
</script>
</body>
</html>
